<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeOfferWellness v4.9 Offering Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color: #101828; background: #faf9f7; font-family: "DM Sans", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { max-width: 1280px; margin: 0 auto; padding: 42px 28px 72px; }
    .heading { margin: 0 0 28px; font-size: 22px; font-weight: 600; letter-spacing: -.04em; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 300px)); justify-content: start; gap: 20px; }

    .card {
      position: relative; display: flex; flex-direction: column; height: 430px; min-height: 430px; overflow: hidden;
      cursor: pointer; border: 1px solid rgba(16,24,40,.1); border-radius: 13px; background: #fff;
      box-shadow: 0 4px 16px rgba(16,24,40,.05);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(79,147,129,.42); box-shadow: 0 20px 48px rgba(16,24,40,.085); }
    .card img { display: block; }
    .standard-media {
      position: relative; height: 145px; flex-shrink: 0; overflow: hidden; background: #eef2f4;
      aspect-ratio: 1.64 / 1;
    }
    .standard-media > img:not(.rosette), .event-background > img, .gift-media > img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 240ms ease;
    }
    .card:hover .standard-media > img:not(.rosette), .card:hover .event-background > img, .card:hover .gift-media > img { transform: scale(1.035); }
    .signal {
      position: absolute; top: 10px; left: 10px; z-index: 3; display: inline-flex; align-items: center; height: 26px;
      padding: 0 10px; border-radius: 999px; background: rgba(255,247,237,.94); color: #b54708;
      font-size: 11px; font-weight: 700; backdrop-filter: blur(10px);
    }
    .rosette { position: absolute; top: 8px; right: 8px; z-index: 3; width: 48px; height: 48px; object-fit: contain !important; }
    .tags { position: absolute; bottom: 10px; left: 10px; z-index: 3; display: flex; gap: 4px; }
    .tag {
      display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border: 1px solid rgba(240,200,121,.9);
      border-radius: 999px; background: rgba(255,229,179,.96); color: #6f4b10; font-size: 10px; font-weight: 700; backdrop-filter: blur(8px);
    }
    .tag.type { border-color: rgba(199,216,251,.9); background: rgba(232,240,255,.96); color: #254a85; }
    .body { display: flex; flex: 1; flex-direction: column; gap: 4px; min-height: 0; overflow: hidden; padding: 11px 13px 10px; }
    .title {
      display: -webkit-box; min-height: 2.4em; margin: 0; overflow: hidden; color: #101828;
      font-size: 18px; font-weight: 300; line-height: 1.2; letter-spacing: -.04em;
      -webkit-box-orient: vertical; -webkit-line-clamp: 2; transition: color 180ms;
    }
    .card:hover .title { color: #4f9381; }
    .provider { margin: 0; color: #667085; font-size: 12px; }
    .rating { display: flex; align-items: center; gap: 5px; color: #344054; font-size: 12px; }
    .stars { display: flex; gap: 1px; color: #f5c84b; font-size: 12px; letter-spacing: -1px; }
    .location { display: flex; align-items: center; gap: 4px; color: #667085; font-size: 12px; }
    .location svg, .availability svg { width: 11px; height: 11px; flex-shrink: 0; }
    .description {
      display: -webkit-box; min-height: 4.35em; margin: 0; overflow: hidden; color: #667085;
      font-size: 12.5px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    }
    .availability {
      display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 7px;
      background: #f6f8fa; color: #344054; font-size: 12px; font-weight: 600;
    }
    .availability.today { background: #eaf5f1; color: #2f6f60; }
    .footer {
      display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 13px 11px; border-top: 1px solid #edf0f2;
    }
    .from { display: block; color: #98a2b3; font-size: 11px; line-height: 1; }
    .price { color: #101828; font-size: 20px; font-weight: 400; letter-spacing: -.05em; }
    .cta {
      height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: rgb(79,147,129); color: #fff;
      font: 400 12.5px "DM Sans", system-ui, sans-serif; letter-spacing: .01em; white-space: nowrap; cursor: pointer;
    }

    .event-background { position: absolute; inset: 0; background: #20312d; }
    .event-background::after { position: absolute; inset: 0; content: ""; background: linear-gradient(to top, rgba(10,18,30,.90) 0%, rgba(10,18,30,.28) 60%, rgba(0,0,0,.05) 100%); }
    .date {
      position: absolute; top: 12px; left: 12px; z-index: 4; display: flex; width: 48px; height: 54px; flex-direction: column;
      align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,.97); box-shadow: 0 6px 18px rgba(0,0,0,.2);
    }
    .date-month { color: #4f9381; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .date-day { color: #101828; font-size: 21px; font-weight: 700; line-height: 1.1; letter-spacing: -.04em; }
    .event-content { position: relative; z-index: 4; display: flex; height: 100%; flex-direction: column; justify-content: flex-end; padding: 14px; color: #fff; }
    .event .tags { position: static; margin-bottom: 7px; }
    .event .tag { height: 21px; border: 0; background: rgba(255,229,179,.9); }
    .event .tag.type { background: rgba(232,240,255,.9); }
    .event .title { min-height: 2.4em; margin: 0 0 3px; color: #fff; font-size: 18px; font-weight: 300; line-height: 1.2; letter-spacing: -.03em; }
    .event .provider { margin: 0 0 6px; color: rgba(255,255,255,.72); }
    .event .location { margin-bottom: 10px; color: rgba(255,255,255,.8); font-size: 11.5px; }
    .event .price { color: #fff; font-size: 19px; letter-spacing: -.04em; }
    .event .from { color: rgba(255,255,255,.6); font-size: 10px; }
    .event-bottom { display: flex; align-items: center; justify-content: space-between; }
    .event .cta { padding: 0 16px; }

    .gift-media {
      position: relative; display: flex; height: 70%; flex: 0 0 70%; align-items: center; justify-content: center;
      overflow: hidden; background: linear-gradient(135deg,#eff8f5,#fff); aspect-ratio: 1.64 / 1;
    }
    .gift-media::after { position: absolute; inset: 0; content: ""; background: linear-gradient(135deg, rgba(239,248,245,.22), rgba(255,255,255,.08)); pointer-events: none; }
    .gift-badge {
      position: absolute; top: 10px; left: 10px; z-index: 2; display: inline-flex; height: 24px; align-items: center; padding: 0 9px;
      border: 1px solid rgba(79,147,129,.2); border-radius: 999px; background: rgba(232,245,241,.95); color: #2f6f60; font-size: 10.5px; font-weight: 700;
    }
    .gift .body { gap: 2px; padding: 12px 14px 10px; }
    .gift .title { min-height: 0; }
    .gift .delivery { margin: 0; color: #667085; font-size: 12.5px; }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cta { font-size: 12px; }
    }
    @media (max-width: 560px) {
      .page { padding: 24px 12px 48px; }
      .heading { margin-bottom: 18px; font-size: 18px; }
      .grid { gap: 12px; }
      .card { height: 360px; min-height: 360px; border-radius: 13px; }
      .standard-media { height: 138px; }
      .title, .event .title { font-size: 15px; }
      .description { display: none; }
      .body { padding: 10px 11px 9px; }
      .footer { padding: 9px 11px 10px; }
      .price { font-size: 18px; }
      .cta { height: 34px; padding: 0 10px; font-size: 10.5px; }
      .event-content { padding: 11px; }
      .event .cta { padding: 0 10px; }
      .event .location { font-size: 10.5px; }
      .signal { max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rosette { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="heading">WeOfferWellness offerings</h1>
    <section class="grid" id="cards" aria-label="WeOfferWellness offering cards"></section>
  </main>
  <script>
    const PREMIUM_ROSETTE_URL = "https://studio.weofferwellness.co.uk/storage/uploads/images/78aa908f-334b-45c0-9220-1c4d84053c5e.png";
    const GIFT_IMAGE_URL = "https://atease.weofferwellness.co.uk/storage/uploads/images/593f1be1-c854-42f4-8f7d-79dbfef9383a.jpg";
    const PRODUCTS = [
      { id: 1, variant: "therapy", title: "Deep Tissue Massage & Myofascial Release", provider: "Sarah Thornton", category: "Therapy", typeLabel: "Therapy", location: "Shoreditch, London", distance: "1.2 miles", online: false, price: 65, rating: 4.8, reviews: 34, premium: true, image: "https://images.unsplash.com/photo-1745327883290-1e9c6447b938?w=560&h=340&fit=crop&auto=format", availDays: [1,3,4,5], signal: "Popular this week", description: "A deeply restorative full-body treatment combining deep tissue techniques with targeted myofascial release to ease chronic tension and restore mobility.", coords: [-0.0755, 51.5227] },
      { id: 2, variant: "event", title: "Summer Sound Bath & Meditation Evening", provider: "Amara Singh", category: "Wellness", typeLabel: "Event", location: "Hackney, London", distance: "2.8 miles", online: false, price: 28, rating: 4.6, reviews: 52, image: "https://images.unsplash.com/photo-1562088287-bde35a1ea917?w=560&h=680&fit=crop&auto=format", availDays: [], description: "An immersive group sound journey using Tibetan singing bowls, gongs and crystal bowls to guide you into deep relaxation and presence.", eventDate: { month: "Jul", day: "19" }, eventRange: "Sat 19 Jul, 7:00 – 9:00 PM", eventTiles: [{ month: "Jul", day: "19" }, { month: "Jul", day: "26" }, { month: "Aug", day: "02" }], coords: [-0.0553, 51.5416] },
      { id: 3, variant: "therapy", title: "Holistic Reflexology & Energy Work", provider: "Priya Kapoor", category: "Reflexology", typeLabel: "Therapy", location: "Islington, London", distance: "3.5 miles", online: false, price: 75, rating: 4.7, reviews: 19, premium: true, image: "https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?w=560&h=340&fit=crop&auto=format", availDays: [2,4,5], description: "A holistic session combining reflexology foot mapping with chakra energy balancing to promote systemic wellbeing and deep calm.", coords: [-0.1027, 51.5404] },
      { id: 4, variant: "therapy", title: "Yin Yoga & Guided Breathwork", provider: "Lena Schmidt", category: "Yoga", typeLabel: "Class", location: "Online", online: true, price: 18, rating: 4.9, reviews: 87, image: "https://images.unsplash.com/photo-1654678778840-37d89dedd2a8?w=560&h=340&fit=crop&auto=format", availDays: [1,2,3,4,5,6,0], signal: "Exclusively online", description: "A slow, meditative yoga practice paired with conscious breathwork to release deep connective tissue tension. Suitable for all levels." },
      { id: 5, variant: "therapy", title: "Hot Stone & Swedish Massage", provider: "Clare Williams", category: "Massage", typeLabel: "Therapy", location: "Tonbridge, Kent", distance: "28 miles", online: false, price: 90, rating: 5.0, reviews: 11, image: "https://images.unsplash.com/photo-1600334129128-685c5582fd35?w=560&h=340&fit=crop&auto=format", availDays: [1,2,5,6], description: "Heated volcanic stones glide over muscles to melt tension while Swedish strokes promote circulation and deep relaxation in a warm, tranquil setting.", coords: [0.2687, 51.1987] },
      { id: 6, variant: "event", title: "Weekend Nature Retreat — Stillness & Forest Bathing", provider: "The Grove Collective", category: "Retreat", typeLabel: "Retreat", location: "Surrey Hills", distance: "22 miles", online: false, price: 350, rating: 4.9, reviews: 7, image: "https://images.unsplash.com/photo-1704502889897-83d6ebcca97e?w=560&h=680&fit=crop&auto=format", availDays: [], description: "A two-day immersive retreat in the Surrey Hills combining forest bathing, yin yoga, breathwork and mindful eating to restore your nervous system.", eventDate: { month: "Aug", day: "09" }, eventRange: "Sat 9 – Sun 10 Aug", eventTiles: [{ month: "Aug", day: "09" }, { month: "Aug", day: "10" }], coords: [-0.3533, 51.2167] },
      { id: 7, variant: "therapy", title: "Reiki Healing & Chakra Balancing", provider: "Maya Osei", category: "Energy Healing", typeLabel: "Therapy", location: "Camden, London", distance: "4.1 miles", online: true, price: 55, rating: 4.8, reviews: 28, premium: true, image: "https://images.unsplash.com/photo-1598901986949-f593ff2a31a6?w=560&h=340&fit=crop&auto=format", availDays: [2,3,4], signal: "Online & In-person", description: "A gentle energy healing session using Usui Reiki to clear energetic blockages, balance the chakra system and promote self-healing.", coords: [-0.1416, 51.5390] },
      { id: 8, variant: "gift", title: "WeOfferWellness Gift Card", provider: "", category: "Gift", typeLabel: "Gift", location: "Anywhere", online: true, price: 25, rating: 0, reviews: 0, image: GIFT_IMAGE_URL, availDays: [], description: "A flexible digital gift card redeemable across all therapies, classes, events and retreats on WeOfferWellness. Delivered instantly by email." },
      { id: 9, variant: "therapy", title: "Sports Massage & Injury Rehabilitation", provider: "James Hartley", category: "Sports Therapy", typeLabel: "Therapy", location: "Canary Wharf, London", distance: "5.8 miles", online: false, price: 80, rating: 4.7, reviews: 41, image: "https://images.unsplash.com/photo-1660324350911-124de1e4154a?w=560&h=340&fit=crop&auto=format", availDays: [1,2,3,4,5], description: "Targeted sports massage combining deep tissue work, trigger point therapy and movement assessment to address chronic injury and improve athletic performance.", coords: [-0.0202, 51.5034] }
    ];

    const icon = (name) => name === "wifi"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6.95 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>'
      : name === "cal"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s7-4.4 7-11a7 7 0 1 0-14 0c0 6.6 7 11 7 11Z"/><circle cx="12" cy="10" r="3"/></svg>';

    function availability(product) {
      if (product.variant === "event") return product.eventRange ? `Dates: ${product.eventRange}` : "Check event dates";
      if (product.variant === "gift") return "Instant email delivery";
      if (!product.availDays.length) return "Contact to check availability";
      if (product.availDays.length === 7) return "Available every day";
      const today = new Date().getDay();
      const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      for (let offset = 0; offset <= 7; offset += 1) {
        const day = (today + offset) % 7;
        if (product.availDays.includes(day)) {
          if (offset === 0) return "Available today";
          if (offset === 1) return "Available tomorrow";
          return `Next available: ${names[day]}`;
        }
      }
      return "Contact to book";
    }

    function tags(product) {
      return `<div class="tags"><span class="tag">${product.category}</span><span class="tag type">${product.typeLabel}</span></div>`;
    }

    function standardCard(product) {
      const avail = availability(product);
      const location = product.online ? "Online" : `${product.location}${product.distance ? ` · ${product.distance}` : ""}`;
      const stars = "★".repeat(Math.round(product.rating)) + "☆".repeat(5 - Math.round(product.rating));
      return `<article class="card standard">
        <div class="standard-media">
          <img src="${product.image}" alt="${product.title}" loading="lazy">
          ${product.signal ? `<span class="signal">${product.signal}</span>` : ""}
          ${product.premium ? `<img class="rosette" src="${PREMIUM_ROSETTE_URL}" alt="Premium Partner rosette">` : ""}
          ${tags(product)}
        </div>
        <div class="body">
          <h2 class="title">${product.title}</h2>
          <p class="provider">with ${product.provider}</p>
          <div class="rating"><span class="stars" aria-label="${product.rating} out of 5 stars">${stars}</span><span>${product.rating.toFixed(1)} · ${product.reviews} reviews</span></div>
          <div class="location">${icon(product.online ? "wifi" : "geo")}<span>${location}</span></div>
          <p class="description">${product.description}</p>
          <div class="availability ${avail.startsWith("Available today") || avail.startsWith("Available every") ? "today" : ""}">${icon("cal")}<span>${avail}</span></div>
        </div>
        <footer class="footer"><div><small class="from">From</small><span class="price">£${product.price}</span></div><button class="cta" type="button">${window.innerWidth <= 980 ? "BOOK" : "VIEW & BOOK"}</button></footer>
      </article>`;
    }

    function eventCard(product) {
      const location = `${product.location}${product.distance ? ` · ${product.distance}` : ""}`;
      return `<article class="card event">
        <div class="event-background"><img src="${product.image}" alt="${product.title}" loading="lazy"></div>
        <div class="date"><span class="date-month">${product.eventDate.month}</span><span class="date-day">${product.eventDate.day}</span></div>
        <div class="event-content">
          ${tags(product)}
          <h2 class="title">${product.title}</h2>
          <p class="provider">with ${product.provider}</p>
          <div class="location">${icon("geo")}<span>${location}</span></div>
          <div class="event-bottom"><div><small class="from">From</small><span class="price">£${product.price}</span></div><button class="cta" type="button">${window.innerWidth <= 980 ? "BOOK" : "VIEW & BOOK"}</button></div>
        </div>
      </article>`;
    }

    function giftCard(product) {
      return `<article class="card gift">
        <div class="gift-media"><img src="${product.image}" alt="${product.title}" loading="lazy"><span class="gift-badge">Digital gift card</span></div>
        <div class="body"><h2 class="title">${product.title}</h2><p class="delivery">${availability(product)}</p></div>
        <footer class="footer"><div><small class="from">From</small><span class="price">£${product.price}</span></div><button class="cta" type="button" aria-label="Buy a WeOfferWellness gift card">${window.innerWidth <= 980 ? "BUY" : "BUY GIFT CARD"}</button></footer>
      </article>`;
    }

    document.querySelector("#cards").innerHTML = PRODUCTS.map((product) => {
      if (product.variant === "event") return eventCard(product);
      if (product.variant === "gift") return giftCard(product);
      return standardCard(product);
    }).join("");
  </script>
</body>
</html>
